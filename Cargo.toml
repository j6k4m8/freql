[package]
name = "freql"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A general-purpose process-flow language with exact units and explicit ownership"
license = "MIT"

[lib]
name = "freql"
path = "src/lib.rs"

[[bin]]
name = "freql"
path = "src/main.rs"

[dependencies]
ariadne = "0.5"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
logos = "0.15"
lsp-server = "0.7"
lsp-types = "0.97"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
notify = "8"
petgraph = "0.7"
rowan = "0.16"
rustyline = "18.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
url = "2.5"

[dev-dependencies]
proptest = "1.6"
tempfile = "3.15"
